version: '3.8'

services:
  ghost:
    build: .
    container_name: ghost
    restart: unless-stopped
    ports:
      - "8766:8766"
    volumes:
      - ghost-data:/var/ghost/data
      - ghost-workspace:/var/lib/ghost/workspace
    environment:
      - GHOST_AGENTS_DEFAULTS_PROVIDER=${GHOST_PROVIDER:-moonshot}
      - GHOST_AGENTS_DEFAULTS_MODEL=${GHOST_MODEL:-kimi-k2.5}
      - KIMI_API_KEY=${KIMI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GHOST_CHANNELS_TELEGRAM_ENABLED=${GHOST_TELEGRAM_ENABLED:-false}
      - GHOST_CHANNELS_TELEGRAM_TOKEN=${GHOST_TELEGRAM_TOKEN:-}
      - GHOST_CHANNELS_DISCORD_ENABLED=${GHOST_DISCORD_ENABLED:-false}
      - GHOST_CHANNELS_DISCORD_TOKEN=${GHOST_DISCORD_TOKEN:-}
    networks:
      - ghost-net

  ghost-web:
    build: .
    container_name: ghost-web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ghost-data:/var/ghost/data
      - ghost-workspace:/var/lib/ghost/workspace
    environment:
      - BRIDGE_SECRET=${BRIDGE_SECRET:-}
    networks:
      - ghost-net
    profiles:
      - setup

volumes:
  ghost-data:
  ghost-workspace:

networks:
  ghost-net:
    driver: bridge
